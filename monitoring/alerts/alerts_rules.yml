groups:
  - name: rag_system_alerts
    interval: 30s
    rules:
      - alert: HighResponseTime
        expr: rate(query_duration_seconds[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High query response time"
          description: "Query response time is above 5 seconds"

      - alert: HighErrorRate
        expr: rate(query_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 10%"

      - alert: LowCacheHitRate
        expr: rate(cache_hits[5m]) / rate(cache_requests[5m]) < 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low cache hit rate"
          description: "Cache hit rate is below 50%"

      - alert: DatabaseConnectionFailure
        expr: up{job="postgres"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Database connection failure"
          description: "Cannot connect to database"