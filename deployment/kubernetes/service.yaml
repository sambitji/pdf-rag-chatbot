apiVersion: v1
kind: Service
metadata:
  name: streamlit-service
spec:
  selector:
    app: rag-system
    component: streamlit
  ports:
  - protocol: TCP
    port: 8501
    targetPort: 8501
  type: LoadBalancer

---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  selector:
    app: rag-system
    component: api
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
spec:
  selector:
    app: redis
  ports:
  - protocol: TCP
    port: 6379
    targetPort: 6379
  type: ClusterIP