version: '3.8'

services:
  # Streamlit UI
  streamlit:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_HOST=redis
      - ENVIRONMENT=production
    volumes:
      - ../../storage:/app/storage
      - ../../logs:/app/logs
    depends_on:
      - redis
    restart: unless-stopped

  # FastAPI Backend
  api:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - REDIS_HOST=redis
      - ENVIRONMENT=production
      - API_SECRET_KEY=${API_SECRET_KEY}
    volumes:
      - ../../storage:/app/storage
      - ../../logs:/app/logs
    depends_on:
      - redis
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - streamlit
      - api
    restart: unless-stopped

volumes:
  redis_data: